[project]
name = "spec-mcp"
version = "0.7.0"
description = "MCP server for project docs, user flows, requirements, data model, UI registry, designs and schema-validated record collections, optional local-RAG over Ollama"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jakub Bryndal" }]
dependencies = ["mcp>=2,<3", "jsonschema>=4.18", "httpx>=0.27"]

[project.optional-dependencies]
fast = ["numpy>=1.26"]

[project.scripts]
spec-mcp = "spec_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]

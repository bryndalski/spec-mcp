[project]
name = "spec-mcp"
version = "0.2.0"
description = "MCP server for managing project docs, user flows and requirements with coverage and validation"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
authors = [{ name = "Jakub Bryndal" }]
dependencies = ["mcp>=2,<3"]

[project.scripts]
spec-mcp = "spec_mcp.server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/spec_mcp"]

[dependency-groups]
dev = ["pytest>=8"]

[tool.pytest.ini_options]
testpaths = ["tests"]
